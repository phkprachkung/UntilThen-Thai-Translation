name: Discord Advanced Release Notification

on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Advanced Embed Message to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
          -d "{
            \"username\": \"github update\", 
            \"avatar_url\": \"https://cdn.discordapp.com/attachments/1521578053183209532/1521578134258974750/82f39c795967f47f4b4244da53f66970.jpg?ex=6a455790&is=6a440610&hm=ce6c5d9fec6dcba588577e53f67f3f92c2585310d4791ef233c3140a63d3b355\",
            \"embeds\": [
              {
                \"title\": \"🎉 อัปเดตใหม่มาแล้ว: ${{ github.event.release.name }}\",
                \"url\": \"${{ github.event.release.html_url }}\",
                \"description\": \"# 📦 เวอร์ชั่น ${{ github.event.release.tag_name }}\\n\\n✨ **มีอะไรใหม่?**\\nสามารถคลิกที่ลิงก์ชื่อการอัปเดตด้านบนเพื่อดูรายละเอียดแบบเต็มๆ ได้เลยครับ\\n\\n⬇️ **[>> คลิกที่นี่เพื่อดาวน์โหลดไฟล์ .zip ทันที <<](${{ github.event.repository.html_url }}/archive/refs/tags/${{ github.event.release.tag_name }}.zip)**\\n\\n💡 *ขอบคุณที่ติดตามโปรเจกต์ Until Then ภาษาไทย*\",
                \"color\": 5814783,
                \"thumbnail\": {
                  \"url\": \"https://cdn.discordapp.com/attachments/1521578053183209532/1521578548471664983/Gemini_Generated_Image_lslubnlslubnlslu_1.png?ex=6a4557f3&is=6a440673&hm=4aecd69fee9111942cbb76c743f3e2a10976482daed72503557a1c3dd6e9167b\"
                },
                \"fields\": [
                  {
                    \"name\": \"👤 ผู้ปล่อยอัปเดต\",
                    \"value\": \"[${{ github.event.release.author.login }}](${{ github.event.release.author.html_url }})\",
                    \"inline\": true
                  },
                  {
                    \"name\": \"🔗 ลิงก์ที่เกี่ยวข้อง\",
                    \"value\": \"[ไปที่หน้า GitHub](${{ github.event.repository.html_url }})\",
                    \"inline\": true
                  }
                ],
                \"footer\": {
                  \"text\": \"Until Then - Thai Mod\",
                  \"icon_url\": \"https://cdn.discordapp.com/attachments/1521578053183209532/1521578548471664983/Gemini_Generated_Image_lslubnlslubnlslu_1.png?ex=6a4557f3&is=6a440673&hm=4aecd69fee9111942cbb76c743f3e2a10976482daed72503557a1c3dd6e9167b\"
                },
                \"timestamp\": \"${{ github.event.release.published_at }}\"
              }
            ]
          }" \
          $DISCORD_WEBHOOK
